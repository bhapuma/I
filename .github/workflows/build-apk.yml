name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          npm install --force

      - name: Build Web Application
        run: |
          npx vite build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug || ./gradlew assembleRelease
          cd ..

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          # Copy debug or release APKs
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-output/ \;
          cd build-output
          # Provide standard names
          for f in *.apk; do
            if [ -f "$f" ]; then
              echo "Found APK: $f"
              cp "$f" "AI-Video-Studio-app.apk"
              break
            fi
          done
          ls -la

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || format('v1.0.{0}', github.run_number) }}
          name: AI Video Studio APK (${{ github.event.inputs.tag_name || format('v1.0.{0}', github.run_number) }})
          body: |
            ## 📱 AI Video Studio - Android APK Release
            
            तपाईंको AI भिडियो स्टुडियो एन्ड्रोइड एपको नयाँ APK सफलतापूर्वक तयार भएको छ।
            
            ### 📥 Download & Installation Guide:
            1. तल दिइएको **`AI-Video-Studio-app.apk`** फाइल डाउनलोड गर्नुहोस्।
            2. डाउनलोड पूरा भएपछि फाइल खोलेर **Install** मा थिच्नुहोस्।
            3. यदि "Install unknown apps" सोधेमा ब्राउजरलाई अनुमति दिनुहोस् (Allow from this source)।
            4. एप खोल्नुहोस् र बिना कुनै सीमा असीमित एआई भिडियो र भ्वाइसओभर बनाउनुहोस्!
            
            ---
            *Built automatically via GitHub Actions.*
          files: build-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
