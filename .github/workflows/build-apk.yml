name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n856e2d4107d7641809cb173ec4b61b42490a94d1" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare Capacitor Android Project
        run: |
          # If android directory is missing or incomplete, recreate it
          if [ ! -f "android/build.gradle" ] || [ ! -f "android/gradlew" ]; then
            echo "Android project missing or incomplete. Recreating fresh with Capacitor..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Regenerating gradle wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          # Find generated apk files
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-output/ \; || true
          find android/ -type f -name "*.apk" -exec cp {} build-output/ \; || true
          cd build-output
          # Ensure a friendly named apk exists
          for f in *debug*.apk *.apk; do
            if [ -f "$f" ]; then
              echo "Found APK: $f"
              cp "$f" "AI-Video-Studio-app.apk"
              break
            fi
          done
          echo "APK build directory contents:"
          ls -lh

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || format('v1.0.{0}', github.run_number) }}
          name: AI Video Studio APK (${{ github.event.inputs.tag_name || format('v1.0.{0}', github.run_number) }})
          body: |
            ## 📱 AI Video Studio - Android APK Release

            तपाईंको AI भिडियो स्टुडियो एन्ड्रोइड एपको नयाँ APK सफलतापूर्वक तयार भएको छ।

            ### 📥 Download & Installation Guide:
            1. तल Assets बाट **`AI-Video-Studio-app.apk`** फाइल डाउनलोड गर्नुहोस्।
            2. डाउनलोड पूरा भएपछि फाइल खोलेर **Install** थिच्नुहोस्।
            3. यदि "Install unknown apps" सोधेमा ब्राउजरलाई अनुमति दिनुहोस् (Allow from this source)।
            4. एप खोल्नुहोस् र बिना कुनै सीमा असीमित एआई भिडियो र भ्वाइसओभर बनाउनुहोस्!
          files: build-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
